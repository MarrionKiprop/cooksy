[project]
name = "cooksy"
version = "0.1.0"
description = "Your ingredients. The world’s kitchens. A Jac-native culinary companion."
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
"@playwright/test" = "1.64.1"



[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"


[client]

[client.app_meta_data]
title = "Cooksy — Your ingredients. The world’s kitchens."
description = "A Jac-native culinary discovery and cook-along companion. Development shell preview."
theme_color = "#f8f6ef"

[placement.pins]
"endpoints.shell_status" = "server"
"endpoints.discover" = "server"
"endpoints.match_pantry" = "server"
"endpoints.get_recipe" = "server"
"endpoints.cook_session" = "server"

"endpoints.enrich" = "server"
"endpoints.discover_pantry" = "server"
"endpoints.prepare_candidate" = "server"
"endpoints.cooking_help" = "server"

"endpoints.culinary_regions" = "server"
"endpoints.review_ingredients" = "server"
"endpoints.confirm_ingredients" = "server"
"endpoints.recommend_meals" = "server"
"endpoints.restore_meals" = "server"

[byllm.model]
default_model = "gpt-4.1-mini"
